<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Condicionales | Portafolio JS</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5968/5968292.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-lg bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center font-black text-slate-950 text-sm tracking-tighter">
                    JS
                </div>
                <span class="text-lg font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    Control Flow Lab
                </span>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-cyan-400 border border-cyan-500/10">
                Arrow Functions ES6
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-12 flex flex-col items-center justify-center">
        <div class="text-center max-w-xl mb-12">
            <h1 class="text-3xl font-extrabold tracking-tight mb-3 bg-gradient-to-r from-white via-slate-200 to-slate-500 bg-clip-text text-transparent">
                Estructuras Condicionales
            </h1>
            <p class="text-sm text-slate-400">
                Selecciona un cuadro para ejecutar la práctica correspondiente refactorizada con funciones flecha.
            </p>
        </div>

        <div id="grid-ejercicios" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 w-full max-w-3xl">
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-600">
        <p>&copy; 2026 Code Lab. Diseñado con HTML, Tailwind CSS y JavaScript Moderno.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
